<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python Flask Docker App</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #3776ab 0%, #ffd43b 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #333;
        }
        .container {
            background: white;
            padding: 3rem;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 90%;
        }
        h1 { color: #3776ab; margin-bottom: 0.5rem; }
        .version { color: #999; font-size: 0.85rem; margin-bottom: 1.5rem; }
        p { margin: 1rem 0; color: #666; }
        button {
            background: #3776ab;
            color: white;
            border: none;
            padding: 0.75rem 2rem;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
            margin: 0.25rem;
        }
        button:hover { background: #2b5d88; }
        pre {
            background: #f5f5f5;
            padding: 1rem;
            border-radius: 6px;
            overflow-x: auto;
            font-size: 0.8rem;
            margin-top: 1rem;
            text-align: left;
        }
        .buttons { margin: 1.5rem 0; }
        footer {
            margin-top: 2rem;
            padding-top: 1rem;
            border-top: 1px solid #eee;
            font-size: 0.8rem;
            color: #999;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🐍 Python Flask in Docker</h1>
        <p class="version">Version {{ version }}</p>
        <p>This page is served by a Flask application running inside a Docker container.</p>

        <div class="buttons">
            <button onclick="callApi('/api/health')">Health</button>
            <button onclick="callApi('/api/info')">Info</button>
            <button onclick="testAdd()">Add 2 + 3</button>
        </div>

        <pre id="output">Click a button to call an API endpoint...</pre>

        <footer>
            Served by: Flask (Docker Container)
        </footer>
    </div>

    <script>
        async function callApi(path) {
            const output = document.getElementById('output');
            output.textContent = 'Loading...';
            try {
                const res = await fetch(path);
                const data = await res.json();
                output.textContent = JSON.stringify(data, null, 2);
            } catch (err) {
                output.textContent = 'Error: ' + err.message;
            }
        }

        async function testAdd() {
            const output = document.getElementById('output');
            output.textContent = 'Loading...';
            try {
                const res = await fetch('/api/add', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ a: 2, b: 3 })
                });
                const data = await res.json();
                output.textContent = JSON.stringify(data, null, 2);
            } catch (err) {
                output.textContent = 'Error: ' + err.message;
            }
        }
    </script>
</body>
</html>
